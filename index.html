<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const DEFAULT_EXERCISES = [
  { id:"aus_pull", name:"Australian Pull-Ups", icon:"🏋️", muscle:"Back", equipment:"Bodyweight", custom:false, hidden:false },
  { id:"neg_pull", name:"Negative Pull-Ups", icon:"⬇️", muscle:"Back", equipment:"Bodyweight", custom:false, hidden:false },
  { id:"pullup", name:"Pull-Up", icon:"🧗", muscle:"Back", equipment:"Bodyweight", custom:false, hidden:false },
  { id:"dec_push", name:"Decline Push-Ups", icon:"💪", muscle:"Chest", equipment:"Bodyweight", custom:false, hidden:false },
  { id:"pushup", name:"Push-Up", icon:"💪", muscle:"Chest", equipment:"Bodyweight", custom:false, hidden:false },
  { id:"pike_push", name:"Incline Pike Push-Ups", icon:"🔺", muscle:"Shoulder", equipment:"Bodyweight", custom:false, hidden:false },
  { id:"db_shoulder_press", name:"DB Shoulder Press", icon:"🏋️", muscle:"Shoulder", equipment:"Dumbbell", custom:false, hidden:false },
  { id:"lateral_raise", name:"Lateral Raise", icon:"↔️", muscle:"Shoulder", equipment:"Dumbbell", custom:false, hidden:false },
  { id:"reverse_fly", name:"Reverse Fly", icon:"🪽", muscle:"Shoulder", equipment:"Dumbbell", custom:false, hidden:false },
  { id:"knee_raise", name:"Hanging Knee Raises", icon:"🦵", muscle:"Core", equipment:"Bodyweight", custom:false, hidden:false },
  { id:"plank", name:"Plank", icon:"🧱", muscle:"Core", equipment:"Bodyweight", custom:false, hidden:false },
  { id:"squats", name:"Bodyweight Squats", icon:"🦴", muscle:"Legs", equipment:"Bodyweight", custom:false, hidden:false },
  { id:"goblet_squat", name:"Goblet Squat", icon:"🏋️", muscle:"Legs", equipment:"Dumbbell", custom:false, hidden:false },
  { id:"split_squat", name:"Split Squat", icon:"🦵", muscle:"Legs", equipment:"Bodyweight", custom:false, hidden:false },
];

let ACTIVE_EXERCISES = DEFAULT_EXERCISES;

const DAYS_TH = ["อา","จ","อ","พ","พฤ","ศ","ส"];
const MONTHS_TH = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const FALLBACK_KEY = "workout_tracker_v2_fallback";

const DEFAULT_GOALS = {
  pullupReps: 5,
  zone2MinWeek: 120,
  weeklyStrengthSessions: 3,
  weeklyCardioSessions: 3,
  targetPace: "8:00",
  bodyWeight: 60
};

function dateKey(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function normalizeDay(value) {
  if (!value) return [];
  if (Array.isArray(value)) return value.filter(Boolean);
  if (typeof value === "object") return [{ ...value, id: value.id || "legacy_" + Date.now() }];
  return [];
}

function normalizeData(data) {
  const out = { logs:{}, exerciseLibrary:[], hiddenExercises:[], goals:{...DEFAULT_GOALS} };
  const logs = data && data.logs ? data.logs : {};
  Object.keys(logs).forEach(k => out.logs[k] = normalizeDay(logs[k]));
  if (Array.isArray(data?.exerciseLibrary)) out.exerciseLibrary = data.exerciseLibrary;
  if (Array.isArray(data?.hiddenExercises)) out.hiddenExercises = data.hiddenExercises;
  if (data?.goals) out.goals = { ...DEFAULT_GOALS, ...data.goals };
  return out;
}

function getAllExercises(data) {
  const custom = Array.isArray(data?.exerciseLibrary) ? data.exerciseLibrary : [];
  const hidden = Array.isArray(data?.hiddenExercises) ? data.hiddenExercises : [];
  const merged = [...DEFAULT_EXERCISES, ...custom].map(ex => ({...ex, hidden:hidden.includes(ex.id)}));
  return merged;
}

function getVisibleExercises() {
  return ACTIVE_EXERCISES.filter(ex => !ex.hidden);
}

async function sheetLoad() {
  try {
    const res = await fetch("/api/load", { cache:"no-store" });
    if (!res.ok) throw new Error("Load API failed");
    return normalizeData(await res.json());
  } catch {
    try {
      const raw = localStorage.getItem(FALLBACK_KEY);
      return normalizeData(raw ? JSON.parse(raw) : { logs:{} });
    } catch {
      return normalizeData({ logs:{} });
    }
  }
}

async function sheetSave(allData) {
  const normalized = normalizeData(allData);
  localStorage.setItem(FALLBACK_KEY, JSON.stringify(normalized));
  try {
    const res = await fetch("/api/save", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(normalized),
    });
    if (!res.ok) throw new Error("Save API failed");
    return normalized;
  } catch (err) {
    console.warn("Cloud save failed, saved fallback only", err);
    return normalized;
  }
}

async function syncStravaLatest() {
  const res = await fetch("/api/strava-sync", { cache:"no-store" });
  if (!res.ok) throw new Error("Strava sync failed");
  return await res.json();
}

function calculatePace(duration, distance) {
  const d = Number(distance || 0), t = Number(duration || 0);
  if (!d || !t) return "—";
  const totalSeconds = (t * 60) / d;
  return Math.floor(totalSeconds/60) + ":" + String(Math.round(totalSeconds % 60)).padStart(2,"0");
}

function paceDecimal(duration, distance) {
  const d = Number(distance || 0), t = Number(duration || 0);
  if (!d || !t) return null;
  return t / d;
}

function paceToDecimal(pace) {
  const [m,s] = String(pace || "0:00").split(":").map(Number);
  return (m || 0) + (s || 0) / 60;
}

function allSessions(logs) {
  return Object.entries(logs || {})
    .flatMap(([date,sessions]) => normalizeDay(sessions).map(s => ({ ...s, date })))
    .sort((a,b) => String(a.date).localeCompare(String(b.date)) || String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
}

function getActivityKind(session) {
  const text = String(session.notes || session.workout || session.name || "").toLowerCase();
  if (session.type === "strength") return "strength";
  if (text.includes("walk") || text.includes("walking") || text.includes("hike")) return "walk";
  if (text.includes("run") || text.includes("running") || text.includes("treadmill") || text.includes("indoor run")) return "run";
  if (text.includes("ride") || text.includes("cycling") || text.includes("bike") || text.includes("yoga") || text.includes("workout") || text.includes("weight") || text.includes("training") || text.includes("gym") || text.includes("strength") || text.includes("elliptical") || text.includes("row") || text.includes("swim")) return "general";
  return session.source === "Strava" ? "general" : (session.type || "cardio");
}

function getExerciseMeta(id) {
  return ACTIVE_EXERCISES.find(ex => ex.id === id) || { id, name:id, icon:"•", muscle:"Other", equipment:"-", custom:false, hidden:false };
}

function normalizeStrengthEntry(key, value) {
  if (Array.isArray(value)) {
    return {
      key, plannedId:key, actualId:key, replacedFrom:null, replaceReason:"",
      sets:value.filter(v => v !== "" && v !== null && v !== undefined).map(v => ({ reps:v, weight:"", rpe:"" })),
      note:""
    };
  }

  if (value && typeof value === "object") {
    const plannedId = value.plannedId || value.planned || key;
    const actualId = value.actualId || value.actualExercise || value.actual || plannedId;
    const rawSets = Array.isArray(value.sets) ? value.sets : [];
    return {
      key, plannedId, actualId,
      replacedFrom:value.replacedFrom || (actualId !== plannedId ? plannedId : null),
      replaceReason:value.replaceReason || "",
      sets:rawSets.map(s => typeof s === "object"
        ? { reps:s.reps || "", weight:s.weight || "", rpe:s.rpe || "" }
        : { reps:s || "", weight:"", rpe:"" }),
      note:value.note || ""
    };
  }

  return { key, plannedId:key, actualId:key, replacedFrom:null, replaceReason:"", sets:[], note:"" };
}

function getStrengthEntries(session) {
  if (!session || !session.exercises) return [];
  return Object.entries(session.exercises)
    .map(([key,value]) => normalizeStrengthEntry(key,value))
    .filter(row => row.sets.some(s => s.reps || s.weight || s.rpe));
}

function countStrengthExercises(session) {
  return getStrengthEntries(session).length;
}

function getStrengthVolume(session) {
  return getStrengthEntries(session).reduce((sum,row) => {
    return sum + row.sets.reduce((s,set) => s + (Number(set.weight || 0) * Number(set.reps || 0)), 0);
  }, 0);
}

function getStrengthPR(logs) {
  const pr = {};
  allSessions(logs).forEach(session => {
    getStrengthEntries(session).forEach(row => {
      const id = row.actualId;
      row.sets.forEach(set => {
        const weight = Number(set.weight || 0);
        const reps = Number(set.reps || 0);
        if (!reps && !weight) return;
        if (!pr[id]) pr[id] = { maxReps:0, maxWeight:0, bestVolume:0, date:session.date };
        if (reps > pr[id].maxReps) pr[id].maxReps = reps;
        if (weight > pr[id].maxWeight) pr[id].maxWeight = weight;
        if (weight * reps > pr[id].bestVolume) {
          pr[id].bestVolume = weight * reps;
          pr[id].date = session.date;
        }
      });
    });
  });
  return pr;
}

function findLastExerciseEntry(logs, exerciseId) {
  const sessions = allSessions(logs).reverse();
  for (const session of sessions) {
    const found = getStrengthEntries(session).find(row => row.actualId === exerciseId);
    if (found) return { session, row:found };
  }
  return null;
}

function progressionText(logs, exerciseId) {
  const last = findLastExerciseEntry(logs, exerciseId);
  if (!last) return "ยังไม่มีข้อมูลครั้งก่อน";
  const sets = last.row.sets.filter(s => s.reps || s.weight);
  if (!sets.length) return "ยังไม่มีข้อมูล set ก่อนหน้า";
  const top = sets.slice().sort((a,b) => (Number(b.weight||0)*Number(b.reps||0)+Number(b.reps||0)) - (Number(a.weight||0)*Number(a.reps||0)+Number(a.reps||0)))[0];
  const w = Number(top.weight || 0);
  const r = Number(top.reps || 0);
  if (w > 0) return "ครั้งก่อน " + w + "kg × " + r + " → วันนี้ลอง " + w + "kg × " + (r + 1) + " หรือ " + (w + 1) + "kg × " + Math.max(1, r - 2);
  return "ครั้งก่อน " + r + " reps → วันนี้ลอง " + (r + 1) + " reps";
}

function isRunWalkCardio(session) {
  const kind = getActivityKind(session);
  return kind === "run" || kind === "walk" || (kind === "cardio" && session.source !== "Strava");
}

function isStrengthSession(session) {
  return !isRunWalkCardio(session);
}

function calculateRecovery(logs) {
  const sessions = allSessions(logs).slice(-8);
  if (!sessions.length) return 100;
  let score = 100;
  const cardio = sessions.filter(s => !isStrengthSession(s));
  const recentMinutes = sessions.reduce((sum,s) => sum + Number(s.duration || 0), 0);

  cardio.forEach(s => {
    const hr = Number(s.avgHR || 0);
    if (hr >= 160) score -= 14;
    else if (hr >= 151) score -= 8;
    else if (hr >= 145) score -= 3;
  });

  if (recentMinutes > 260) score -= 14;
  else if (recentMinutes > 180) score -= 7;

  if (normalizeDay((logs || {})[dateKey()]).length >= 2) score -= 8;
  return Math.max(25, Math.min(100, Math.round(score)));
}

function getWeekSessions(logs, offset = 0) {
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() - now.getDay() - offset * 7);
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  end.setHours(23,59,59,999);
  return allSessions(logs).filter(s => inRange(s.date,start,end));
}

function coachMessage(logs, goals = DEFAULT_GOALS) {
  const recovery = calculateRecovery(logs);
  const sessions = allSessions(logs);
  const latest = sessions[sessions.length - 1];
  const thisWeek = getWeekSessions(logs, 0);
  const lastWeek = getWeekSessions(logs, 1);
  const thisVol = thisWeek.filter(isStrengthSession).reduce((sum,s) => sum + getStrengthVolume(s), 0);
  const lastVol = lastWeek.filter(isStrengthSession).reduce((sum,s) => sum + getStrengthVolume(s), 0);
  const z2 = thisWeek.filter(s => !isStrengthSession(s)).reduce((sum,s) => sum + Number(s.duration || 0), 0);
  const strengthCount = thisWeek.filter(isStrengthSession).length;

  if (!latest) return "เริ่มบันทึก session แรก แล้วระบบจะเริ่มวิเคราะห์ readiness, progression และเป้าหมายให้ครับ";
  if (recovery < 45) return "Recovery ต่ำ วันนี้แนะนำพัก เดินเบา ๆ หรือ mobility 15–20 นาที เพื่อกันล้าสะสม";
  if (thisVol > 0 && lastVol > 0 && thisVol > lastVol * 1.35) return "Volume สัปดาห์นี้เพิ่มเร็วมาก แนะนำคุมความหนักหรือทำ deload เบา ๆ 1–2 วัน";
  if (strengthCount < Number(goals.weeklyStrengthSessions || 0)) return "สัปดาห์นี้ Strength ยังไม่ถึงเป้า เหมาะกับการเพิ่มเวท/บอดี้เวทอีก 1 session";
  if (z2 < Number(goals.zone2MinWeek || 0)) return "Zone 2 ยังไม่ถึงเป้าสัปดาห์นี้ ลองเพิ่ม Easy Run/Walk 25–35 นาที";
  if (!isStrengthSession(latest) && Number(latest.avgHR || 0) > 150) return "Cardio ล่าสุด HR สูงกว่า Zone 2 เล็กน้อย รอบหน้าลองลด pace ลง เพื่อให้ฐานแอโรบิกนิ่งขึ้น";
  if (recovery < 70) return "วันนี้เหมาะกับ Zone 2 เบา ๆ หรือ strength volume กลาง ๆ ยังไม่ควรอัดหนักมาก";
  return "ภาพรวมดีมาก วันนี้เล่น Strength หรือ Zone 2 ตามแผนได้ และเลือก progression เพิ่ม reps/น้ำหนักเล็กน้อยได้";
}

function paceAI(logs) {
  const cardio = allSessions(logs).filter(s => !isStrengthSession(s) && Number(s.distance) > 0 && Number(s.duration) > 0);
  if (cardio.length < 2) return "ยังมีข้อมูล cardio ไม่พอสำหรับวิเคราะห์ pace progression";
  const first = paceDecimal(cardio[0].duration, cardio[0].distance);
  const last = paceDecimal(cardio[cardio.length - 1].duration, cardio[cardio.length - 1].distance);
  if (!first || !last) return "ข้อมูล pace ยังไม่สมบูรณ์";
  const diff = ((first - last) / first) * 100;
  if (diff > 3) return "Pace ดีขึ้นประมาณ " + diff.toFixed(1) + "% จากข้อมูล cardio ที่มี ถือว่า aerobic efficiency กำลังดีขึ้น";
  if (diff < -3) return "Pace ช้าลงประมาณ " + Math.abs(diff).toFixed(1) + "% อาจเกิดจากความล้าหรือคุม HR เข้มขึ้น";
  return "Pace ค่อนข้างนิ่ง เหมาะกับการสร้าง Zone 2 base ต่อเนื่อง";
}

function weeklyReport(logs, goals = DEFAULT_GOALS) {
  const week = getWeekSessions(logs, 0);
  const prev = getWeekSessions(logs, 1);
  const strength = week.filter(isStrengthSession);
  const cardio = week.filter(s => !isStrengthSession(s));
  const z2 = cardio.reduce((sum,s) => sum + Number(s.duration || 0), 0);
  const km = cardio.reduce((sum,s) => sum + Number(s.distance || 0), 0);
  const vol = strength.reduce((sum,s) => sum + getStrengthVolume(s), 0);
  const prevVol = prev.filter(isStrengthSession).reduce((sum,s) => sum + getStrengthVolume(s), 0);
  const volDiff = prevVol ? ((vol - prevVol) / prevVol * 100) : 0;
  const pr = getStrengthPR({ temp:week });
  const pull = pr.pullup?.maxReps || 0;
  return {
    sessions: week.length,
    strength: strength.length,
    cardio: cardio.length,
    z2,
    km,
    vol,
    volDiff,
    pull,
    z2Pct: Math.min(100, Math.round(z2 / Number(goals.zone2MinWeek || 1) * 100)),
    strengthPct: Math.min(100, Math.round(strength.length / Number(goals.weeklyStrengthSessions || 1) * 100))
  };
}

function getPeriodRange(mode) {
  const now = new Date();
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23,59,59);
  if (mode === "week") {
    const start = new Date(now);
    start.setDate(now.getDate() - now.getDay());
    start.setHours(0,0,0,0);
    return { start, end, label:"สัปดาห์นี้" };
  }
  if (mode === "month") {
    return { start:new Date(now.getFullYear(), now.getMonth(), 1), end, label:MONTHS_TH[now.getMonth()] + " " + (now.getFullYear() + 543) };
  }
  return { start:new Date(now.getFullYear(), 0, 1), end, label:"ปี " + (now.getFullYear() + 543) };
}

function inRange(dateStr,start,end) {
  const d = new Date(dateStr + "T12:00:00");
  return d >= start && d <= end;
}

function App() {
  const [tab,setTab] = useState("today");
  const [data,setData] = useState(normalizeData({ logs:{} }));
  const [loading,setLoading] = useState(true);
  const [toast,setToast] = useState(null);
  const [form,setForm] = useState(null);
  const [editing,setEditing] = useState(null);
  const [prefill,setPrefill] = useState(null);

  ACTIVE_EXERCISES = getAllExercises(data);

  const today = dateKey();
  const todaySessions = normalizeDay(data.logs[today]);
  const recovery = calculateRecovery(data.logs);

  useEffect(() => {
    (async () => {
      setData(await sheetLoad());
      setLoading(false);
    })();
  }, []);

  function notify(msg,error=false) {
    setToast({ msg,error });
    setTimeout(() => setToast(null), 3000);
  }

  async function persist(next,msg) {
    const normalized = normalizeData(next);
    setData(normalized);
    await sheetSave(normalized);
    notify(msg || "บันทึกสำเร็จ");
  }

  async function saveSession(payload) {
    const targetDate = editing?.date || today;
    const current = normalizeDay(data.logs[targetDate]);
    let nextSessions;

    if (editing) {
      nextSessions = current.map(s => s.id === editing.session.id ? { ...s, ...payload, id:s.id, updatedAt:new Date().toISOString() } : s);
    } else {
      nextSessions = [...current, { ...payload, id:"sess_" + Date.now(), createdAt:new Date().toISOString() }];
    }

    const next = { ...data, logs:{ ...data.logs, [targetDate]:nextSessions } };
    setForm(null); setEditing(null); setPrefill(null);
    await persist(next, editing ? "แก้ไข session แล้ว" : "เพิ่ม session แล้ว");
  }

  async function deleteSession(date,id) {
    const current = normalizeDay(data.logs[date]);
    await persist({ ...data, logs:{ ...data.logs, [date]:current.filter(s => s.id !== id) } }, "ลบ session แล้ว");
  }

  async function duplicateSession(date,session) {
    const current = normalizeDay(data.logs[date]);
    const copy = { ...session, id:"sess_" + Date.now(), createdAt:new Date().toISOString(), source:session.source ? session.source + " Copy" : "Copy" };
    await persist({ ...data, logs:{ ...data.logs, [date]:[...current, copy] } }, "Duplicate session แล้ว");
  }

  function copyLastStrength() {
    const latest = allSessions(data.logs).reverse().find(s => isStrengthSession(s) && s.type === "strength" && s.exercises);
    if (!latest) {
      notify("ยังไม่มี Strength session ก่อนหน้าให้ copy", true);
      return;
    }
    setEditing(null);
    setPrefill({ ...latest, notes:"" });
    setForm("strength");
  }

  async function importStrava() {
    try {
      const result = await syncStravaLatest();
      if (result.error) throw new Error(result.error);
      setData(await sheetLoad());
      notify(result.message || "Sync Strava สำเร็จ");
    } catch (err) {
      notify("Sync Strava ไม่สำเร็จ: " + err.message, true);
    }
  }

  async function addOrUpdateExercise(payload) {
    const isDefault = DEFAULT_EXERCISES.some(ex => ex.id === payload.id);
    let custom = data.exerciseLibrary || [];
    if (isDefault) {
      custom = custom.filter(ex => ex.id !== payload.id);
      custom.push({ ...getExerciseMeta(payload.id), ...payload, custom:true });
    } else {
      custom = custom.filter(ex => ex.id !== payload.id);
      custom.push({ ...payload, custom:true });
    }
    await persist({ ...data, exerciseLibrary:custom }, "บันทึก Exercise Library แล้ว");
  }

  async function toggleHideExercise(id) {
    const hidden = data.hiddenExercises || [];
    const nextHidden = hidden.includes(id) ? hidden.filter(x => x !== id) : [...hidden, id];
    await persist({ ...data, hiddenExercises:nextHidden }, hidden.includes(id) ? "แสดงท่าแล้ว" : "ซ่อนท่าแล้ว");
  }

  async function saveGoals(goals) {
    await persist({ ...data, goals:{ ...DEFAULT_GOALS, ...goals } }, "บันทึกเป้าหมายแล้ว");
  }

  if (loading) {
    return <div className="app"><div className="header"><div className="title">Loading...</div></div></div>;
  }

  return (
    <div className="app">
      <div className="header">
        <div>
          <div className="title">Calisthenics & Zone 2</div>
          <div className="muted">Multi-session cloud tracker</div>
        </div>
        <div className="badge">GitHub DB</div>
      </div>

      {toast && <div className={"toast " + (toast.error ? "error" : "")}>{toast.msg}</div>}

      <div className="section">
        {tab === "today" && (
          <TodayScreen
            sessions={todaySessions}
            recovery={recovery}
            coach={coachMessage(data.logs, data.goals)}
            paceText={paceAI(data.logs)}
            report={weeklyReport(data.logs, data.goals)}
            onAddCardio={() => { setEditing(null); setPrefill(null); setForm("cardio"); }}
            onAddStrength={() => { setEditing(null); setPrefill(null); setForm("strength"); }}
            onCopyLastStrength={copyLastStrength}
            onSyncStrava={importStrava}
            onEdit={(session) => {
              setEditing({ date:today, session });
              setPrefill(null);
              setForm(isStrengthSession(session) ? "strength" : "cardio");
            }}
            onDelete={(id) => deleteSession(today,id)}
            onDuplicate={(session) => duplicateSession(today,session)}
          />
        )}

        {tab === "history" && (
          <HistoryScreen
            logs={data.logs}
            onDelete={deleteSession}
            onDuplicate={duplicateSession}
            onEdit={(date,session) => {
              setEditing({ date,session });
              setPrefill(null);
              setForm(isStrengthSession(session) ? "strength" : "cardio");
              setTab("today");
            }}
          />
        )}

        {tab === "analytics" && <AnalyticsScreen logs={data.logs} />}
        {tab === "coach" && <CoachScreen logs={data.logs} goals={data.goals} />}
        {tab === "stats" && (
          <StatsScreen
            data={data}
            logs={data.logs}
            goals={data.goals}
            onSaveExercise={addOrUpdateExercise}
            onToggleHide={toggleHideExercise}
            onSaveGoals={saveGoals}
          />
        )}
      </div>

      {form && (
        <Modal>
          <SessionForm
            type={form}
            existing={editing?.session || prefill || null}
            isCopyMode={!editing && !!prefill}
            logs={data.logs}
            onSave={saveSession}
            onCancel={() => { setForm(null); setEditing(null); setPrefill(null); }}
          />
        </Modal>
      )}

      <div className="bottom-nav">
        {[
          ["today","📅","TODAY"],
          ["history","📊","HISTORY"],
          ["analytics","📈","CHARTS"],
          ["coach","🧠","COACH"],
          ["stats","🏆","STATS"],
        ].map(([id,icon,label]) => (
          <button key={id} className={"tab " + (tab === id ? "active" : "")} onClick={() => setTab(id)}>
            <span>{icon}</span><span>{label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function SessionCard({ session,onEdit,onDelete,onDuplicate }) {
  const strength = isStrengthSession(session);
  const kind = getActivityKind(session);
  const title = session.notes || (strength ? "Strength Session" : "Cardio Session");
  const sourceTag = session.source === "Strava";

  return (
    <div className="card2">
      <div className={"tag " + (sourceTag ? "tag-strava" : strength ? "tag-strength" : "tag-cardio")}>
        {sourceTag ? "⚡ Strava" : strength ? "💪 Strength" : kind === "walk" ? "🚶 Walk" : "🏃 Cardio"}
      </div>

      <div style={{ fontWeight:900, marginBottom:10 }}>{title}</div>
      {strength ? <StrengthMetrics session={session} /> : <CardioMetrics session={session} />}

      {!strength && <div className="muted" style={{ marginTop:9 }}>Calories {session.calories || "—"} • Source {session.source || "Manual"}</div>}

      {strength && session.exercises && (
        <div style={{ marginTop:10 }}>
          {getStrengthEntries(session).map(row => {
            const meta = getExerciseMeta(row.actualId);
            const planned = getExerciseMeta(row.plannedId);
            const setText = row.sets.filter(s => s.reps || s.weight).map(s => {
              const w = s.weight ? s.weight + "kg x " : "";
              const r = s.reps ? s.reps : "-";
              const rpe = s.rpe ? " @RPE" + s.rpe : "";
              return w + r + rpe;
            }).join(" / ");

            return (
              <div key={row.key} className="muted" style={{ marginBottom:4 }}>
                {meta.icon} {meta.name}
                {row.replacedFrom && <span style={{ color:"var(--cyan)" }}> แทน {planned.name}</span>}
                : <b style={{ color:"var(--orange)" }}>{setText}</b>

      {strength && !session.exercises && (
        <div className="muted" style={{ marginTop:9 }}>Activity Type: {getActivityKind(session)} • Source {session.source || "Manual"}</div>
      )}

      <div style={{ display:"flex", gap:8, marginTop:12 }}>
        <button className="btn-small" onClick={onEdit}>✏️ Edit</button>

        <button className="btn-small" style={{ background:"#ff4757" }} onClick={onDelete}>🗑 Delete</button>
      </div>
    </div>
  );

function HistoryScreen({ logs,onDelete,onDuplicate,onEdit }) {
  const [selectedDate,setSelectedDate] = useState(dateKey());
  const [viewMonth,setViewMonth] = useState(new Date());

  const year = viewMonth.getFullYear();
  const month = viewMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const calendar = [];
  for (let i=0; i<firstDay.getDay(); i++) calendar.push(null);
  for (let d=1; d<=lastDay.getDate(); d++) calendar.push(new Date(year, month, d));

  const selectedSessions = normalizeDay(logs?.[selectedDate]);

  function changeMonth(offset) {
    const next = new Date(viewMonth);
    next.setDate(1); next.setMonth(next.getMonth() + offset);
    setViewMonth(next);
    setSelectedDate(dateKey(new Date(next.getFullYear(), next.getMonth(), 1)));
  }

  function jumpToday() {
    const now = new Date();
    setViewMonth(now);
    setSelectedDate(dateKey(now));
  }

  return (
    <>
      <div className="card">
        <div className="row" style={{ marginBottom:14 }}>
          <button className="btn-small" onClick={() => changeMonth(-1)}>←</button>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontWeight:900, fontSize:18 }}>📅 {MONTHS_TH[month]} {year + 543}</div>
            <div className="muted">แตะวันที่เพื่อดูรายละเอียด</div>
          </div>
          <button className="btn-small" onClick={() => changeMonth(1)}>→</button>
        </div>

        <button className="btn btn-dark" style={{ padding:"10px 12px", marginBottom:14 }} onClick={jumpToday}>วันนี้</button>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:6, marginBottom:8 }}>
          {DAYS_TH.map(day => <div key={day} style={{ textAlign:"center", fontSize:11, color:"var(--text2)", fontWeight:900 }}>{day}</div>)}
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:6 }}>
          {calendar.map((d,i) => {
            if (!d) return <div key={"empty_" + i} style={{ height:58 }} />;
            const k = dateKey(d);
            const daySessions = normalizeDay(logs?.[k]);
            const hasCardio = daySessions.some(s => !isStrengthSession(s));
            const hasStrength = daySessions.some(s => isStrengthSession(s));
            const isSelected = selectedDate === k;
            const isToday = k === dateKey();

            return (
              <button key={k} onClick={() => setSelectedDate(k)}
                style={{
                  height:58,
                  border:isSelected ? "1px solid var(--cyan)" : isToday ? "1px solid rgba(0,212,255,.45)" : "1px solid transparent",
                  background:isSelected ? "rgba(0,212,255,.16)" : "#141c26",
                  color:"#fff", borderRadius:12, position:"relative", padding:0
                }}>
                <div style={{ fontSize:13, fontWeight:900 }}>{d.getDate()}</div>
                <div style={{ position:"absolute", left:0, right:0, bottom:8, display:"flex", justifyContent:"center", gap:3, minHeight:6 }}>
                  {hasCardio && <span style={{ width:6, height:6, borderRadius:"50%", background:"var(--cyan)" }} />}
                  {hasStrength && <span style={{ width:6, height:6, borderRadius:"50%", background:"var(--orange)" }} />}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      <div className="card">
        <div className="row" style={{ marginBottom:10 }}>
          <b>รายละเอียดวันที่ {selectedDate}</b>
          <span className="muted">{selectedSessions.length} sessions</span>
        </div>

        {selectedSessions.length === 0 && <div className="muted">ไม่มีข้อมูลออกกำลังในวันนี้</div>}

        {selectedSessions.map(s => (
          <SessionCard key={s.id} session={s} onEdit={() => onEdit(selectedDate,s)} onDelete={() => onDelete(selectedDate,s.id)} onDuplicate={() => onDuplicate(selectedDate,s)} />
        ))}

  );
}

function ChartCard({ title,data,valueKey,color }) {
  const values = data.map(x => Number(x[valueKey])).filter(v => Number.isFinite(v));
  if (!data.length || !values.length) {
    return <div className="card"><div style={{ fontWeight:900, marginBottom:12 }}>{title}</div><div className="muted">ยังไม่มีข้อมูลพอสำหรับกราฟ</div></div>;
  }

  const minRaw = Math.min(...values), maxRaw = Math.max(...values);
  const padding = (maxRaw - minRaw || 1) * .16;
  const min = Math.max(0, minRaw - padding), max = maxRaw + padding, range = max - min || 1;
  const w=300,h=190,left=42,right=14,top=18,bottom=34,chartW=w-left-right,chartH=h-top-bottom;

  const pointFor = (item,i) => {
    const x = left + (i * (chartW / Math.max(1, data.length - 1)));
    const y = top + chartH - ((Number(item[valueKey]) - min) / range) * chartH;
    return { x,y,value:Number(item[valueKey]) };
  };

  const points = data.map(pointFor);
  const poly = points.map(p => p.x + "," + p.y).join(" ");
  const yTicks = [max, (max + min)/2, min];
  const avg = values.reduce((a,b) => a+b,0) / values.length;
  const avgY = top + chartH - ((avg - min) / range) * chartH;

  return (
    <div className="card">
      <div className="row" style={{ marginBottom:12 }}>
        <div style={{ fontWeight:900 }}>{title}</div>
        <div className="muted">Avg {avg.toFixed(valueKey === "distance" || valueKey === "pace" ? 1 : 0)}</div>
      </div>

      <svg className="chart" viewBox={"0 0 " + w + " " + h}>
        <rect x="0" y="0" width={w} height={h} fill="#0b111c" />
        {yTicks.map((tick,i) => {
          const y = top + (i * chartH / 2);
          return (
            <g key={i}>
              <line x1={left} y1={y} x2={w-right} y2={y} stroke="rgba(255,255,255,.09)" />
              <text x="8" y={y+4} fill="rgba(232,237,245,.58)" fontSize="10">{tick.toFixed(valueKey === "distance" || valueKey === "pace" ? 1 : 0)}</text>
            </g>
          );
        })}
        <line x1={left} y1={top} x2={left} y2={top+chartH} stroke="rgba(255,255,255,.18)" />
        <line x1={left} y1={top+chartH} x2={w-right} y2={top+chartH} stroke="rgba(255,255,255,.18)" />
        <line x1={left} y1={avgY} x2={w-right} y2={avgY} stroke="rgba(255,255,255,.22)" strokeDasharray="4 5" />
        <polyline points={poly} fill="none" stroke={color} strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" opacity=".94" />
        {points.map((p,i) => <circle key={i} cx={p.x} cy={p.y} r="2.5" fill={color} opacity=".9" />)}
        {data.map((item,i) => {
          const step = data.length > 14 ? Math.ceil(data.length/5) : data.length > 7 ? 2 : 1;
          if (i % step !== 0 && i !== data.length - 1) return null;
          const p = pointFor(item,i);
          return <text key={i} x={p.x} y={h-12} fill="rgba(232,237,245,.58)" fontSize="9" textAnchor="middle">{item.date}</text>;
        })}
      </svg>

      <div className="muted" style={{ marginTop:8 }}>แสดงแนวโน้มภาพรวม • เส้นประคือค่าเฉลี่ย</div>
    </div>
  );
}

function StatsOverview({ logs, range, setRange }) {
  const period = getPeriodRange(range);
  const sessions = allSessions(logs).filter(s => inRange(s.date, period.start, period.end));
  const cardio = sessions.filter(s => !isStrengthSession(s));
  const strength = sessions.filter(s => isStrengthSession(s));
  const totalMin = sessions.reduce((sum,s) => sum + Number(s.duration || 0), 0);
  const totalKm = cardio.reduce((sum,s) => sum + Number(s.distance || 0), 0);
  const hrSessions = sessions.filter(s => Number(s.avgHR || 0) > 0);
  const avgHR = hrSessions.length ? Math.round(hrSessions.reduce((sum,s) => sum + Number(s.avgHR || 0),0) / hrSessions.length) : "—";
  const totalCalories = sessions.reduce((sum,s) => sum + Number(s.calories || 0), 0);
  const strengthVolume = strength.reduce((sum,s) => sum + getStrengthVolume(s), 0);
  const pr = getStrengthPR(logs);
  const prRows = Object.entries(pr).sort((a,b) => (b[1].bestVolume || b[1].maxReps) - (a[1].bestVolume || a[1].maxReps)).slice(0,6);

  return (
    <>
      <div className="card">
        <div className="label" style={{ marginBottom:10 }}>Stats Range</div>
        <div className="segmented">
          <button className={"seg-btn " + (range === "week" ? "active" : "")} onClick={() => setRange("week")}>Week</button>
          <button className={"seg-btn " + (range === "month" ? "active" : "")} onClick={() => setRange("month")}>Month</button>
          <button className={"seg-btn " + (range === "year" ? "active" : "")} onClick={() => setRange("year")}>Year</button>
        </div>
        <div className="muted">{period.label}</div>
      </div>

      <div className="grid2">
        <div className="card"><MiniStat label="SESSIONS" value={sessions.length} color="var(--orange)" /></div>
        <div className="card"><MiniStat label="CARDIO" value={cardio.length} color="var(--cyan)" /></div>
        <div className="card"><MiniStat label="STRENGTH" value={strength.length} color="var(--orange)" /></div>
        <div className="card"><MiniStat label="KM" value={totalKm.toFixed(1)} color="var(--green)" /></div>
        <div className="card"><MiniStat label="MIN" value={totalMin} color="var(--cyan)" /></div>
        <div className="card"><MiniStat label="AVG HR" value={avgHR} color="var(--purple)" /></div>
        <div className="card"><MiniStat label="CAL" value={Math.round(totalCalories)} color="var(--orange)" /></div>
        <div className="card"><MiniStat label="VOLUME" value={Math.round(strengthVolume)} color="var(--green)" /></div>
      </div>

      <div className="card">
        <div className="label">Strength PR</div>
        {prRows.length === 0 && <div className="muted">ยังไม่มีข้อมูล PR</div>}
        {prRows.map(([id,p]) => {
          const meta = getExerciseMeta(id);
          return (
            <div key={id} className="card2">
              <div className="row">
                <div>
                  <div style={{ fontWeight:900 }}>{meta.icon} {meta.name}</div>
                  <div className="muted">{meta.muscle} • {meta.equipment}</div>
                </div>
                <div style={{ textAlign:"right" }}>
                  <div style={{ color:"var(--orange)", fontWeight:900 }}>{p.maxWeight || "BW"} kg</div>
                  <div className="muted">Best {p.maxReps} reps</div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

function ExerciseLibraryScreen({ data, onSaveExercise, onToggleHide }) {
  const [editing,setEditing] = useState(null);
  const [name,setName] = useState("");
  const [muscle,setMuscle] = useState("Chest");
  const [equipment,setEquipment] = useState("Bodyweight");
  const [icon,setIcon] = useState("🏋️");

  function startEdit(ex) {
    setEditing(ex.id);
    setName(ex.name);
    setMuscle(ex.muscle);
    setEquipment(ex.equipment);
    setIcon(ex.icon || "🏋️");
  }

  function reset() {
    setEditing(null); setName(""); setMuscle("Chest"); setEquipment("Bodyweight"); setIcon("🏋️");
  }

  function save() {
    if (!name.trim()) return;
    const id = editing || name.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"") + "_" + Date.now();
    onSaveExercise({ id, name:name.trim(), muscle, equipment, icon, custom:true, hidden:false });
    reset();
  }

  return (
    <>
      <div className="card">
        <div className="label">{editing ? "Edit Exercise" : "Add Custom Exercise"}</div>
        <input className="input" placeholder="ชื่อท่า เช่น DB Row" value={name} onChange={e => setName(e.target.value)} />
        <div className="grid2">
          <select className="input" value={muscle} onChange={e => setMuscle(e.target.value)}>
            {["Chest","Back","Shoulder","Legs","Core","Arms","Cardio","Other"].map(x => <option key={x}>{x}</option>)}
          </select>
          <input className="input" placeholder="Icon" value={icon} onChange={e => setIcon(e.target.value)} />
        </div>
        <input className="input" placeholder="Equipment" value={equipment} onChange={e => setEquipment(e.target.value)} />
        <button className="btn btn-orange" onClick={save}>💾 Save Exercise</button>
        {editing && <button className="btn btn-dark" onClick={reset}>Cancel Edit</button>}
      </div>

      <div className="card">
        <div className="label">Exercise Library</div>
        {getAllExercises(data).map(ex => (
          <div key={ex.id} className="card2" style={{ opacity:ex.hidden ? .45 : 1 }}>
            <div className="row">
              <div>
                <div style={{ fontWeight:900 }}>{ex.icon} {ex.name}</div>
                <div className="muted">{ex.muscle} • {ex.equipment} {ex.custom ? "• Custom" : ""}</div>
              </div>
              <div style={{ display:"flex", gap:6 }}>
                <button className="btn-small" onClick={() => startEdit(ex)}>Edit</button>
                <button className="btn-small" onClick={() => onToggleHide(ex.id)}>{ex.hidden ? "Show" : "Hide"}</button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

function Modal({ children }) {
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.72)", zIndex:50, overflowY:"auto", padding:"28px 12px 120px" }}>
      <div style={{ maxWidth:430, margin:"0 auto" }}>{children}</div>
    </div>
  );
}

function RestTimer({ seconds,setSeconds }) {
  useEffect(() => {
    if (!seconds || seconds <= 0) return;
    const id = setInterval(() => setSeconds(s => Math.max(0, s - 1)), 1000);
    return () => clearInterval(id);
  }, [seconds]);

  if (!seconds) return null;

  const m = Math.floor(seconds / 60);
  const s = String(seconds % 60).padStart(2,"0");

  return (
    <div className="timer">
      <div className="label">Rest Timer</div>
      <div className="timer-value">{m}:{s}</div>
      <button className="btn-small" onClick={() => setSeconds(0)}>Stop</button>
    </div>
  );
}

function SessionForm({ type,existing,isCopyMode,logs,onSave,onCancel }) {
  const isCardio = type === "cardio";
  const [duration,setDuration] = useState(isCopyMode ? "" : existing?.duration || "");
  const [distance,setDistance] = useState(isCopyMode ? "" : existing?.distance || "");
  const [avgHR,setAvgHR] = useState(isCopyMode ? "" : existing?.avgHR || "");
  const [calories,setCalories] = useState(isCopyMode ? "" : existing?.calories || "");
  const [notes,setNotes] = useState(isCopyMode ? "" : existing?.notes || "");
  const [timer,setTimer] = useState(0);
  const [replaceOpen,setReplaceOpen] = useState({});

  const [strengthRows,setStrengthRows] = useState(() => {
    if (existing?.exercises) {
      const rows = Object.entries(existing.exercises).map(([key,value]) => {
        const row = normalizeStrengthEntry(key,value);
        return {
          ...row,
          uid:key + "_" + Math.random().toString(36).slice(2,7),
          sets:row.sets.length ? row.sets.map(s => ({ ...s, rpe:isCopyMode ? "" : s.rpe })) : [{ weight:"", reps:"", rpe:"" }]
        };
      });
      if (rows.length) return rows;
    }

    return getVisibleExercises().slice(0,6).map(ex => ({
      uid:ex.id,
      key:ex.id,
      plannedId:ex.id,
      actualId:ex.id,
      replacedFrom:null,
      replaceReason:"",
      sets:[{ weight:"", reps:"", rpe:"" },{ weight:"", reps:"", rpe:"" },{ weight:"", reps:"", rpe:"" }],
      note:""
    }));
  });

  function updateRow(index,patch) {
    setStrengthRows(rows => rows.map((row,i) => i === index ? { ...row, ...patch } : row));
  }

  function updateSet(rowIndex,setIndex,patch) {
    setStrengthRows(rows => rows.map((row,i) => {
      if (i !== rowIndex) return row;
      return { ...row, sets:row.sets.map((set,j) => j === setIndex ? { ...set, ...patch } : set) };
    }));
  }

  function addSet(rowIndex) {
    setStrengthRows(rows => rows.map((row,i) => {
      if (i !== rowIndex) return row;
      const last = row.sets[row.sets.length - 1] || {};
      return { ...row, sets:[...row.sets, { weight:last.weight || "", reps:"", rpe:"" }] };
    }));
    setTimer(90);
  }

  function removeSet(rowIndex,setIndex) {
    setStrengthRows(rows => rows.map((row,i) => i === rowIndex ? { ...row, sets:row.sets.filter((_,j) => j !== setIndex) } : row));
  }

  function addExercise() {
    const first = getVisibleExercises()[0] || DEFAULT_EXERCISES[0];
    setStrengthRows(rows => [...rows, {
      uid:"row_" + Date.now(),
      key:first.id + "_" + Date.now(),
      plannedId:first.id,
      actualId:first.id,
      replacedFrom:null,
      replaceReason:"",
      sets:[{ weight:"", reps:"", rpe:"" }],
      note:""
    }]);
  }

  function removeExercise(rowIndex) {
    setStrengthRows(rows => rows.filter((_,i) => i !== rowIndex));
  }

  function changePlannedExercise(rowIndex,exerciseId) {
    updateRow(rowIndex, { plannedId:exerciseId, actualId:exerciseId, replacedFrom:null, replaceReason:"" });
  }

  function replaceExercise(rowIndex,actualId) {
    setStrengthRows(rows => rows.map((row,i) => {
      if (i !== rowIndex) return row;
      return {
        ...row,
        actualId,
        replacedFrom:actualId !== row.plannedId ? row.plannedId : null,
        replaceReason:actualId !== row.plannedId ? "changed_in_session" : ""
      };
    }));
  }

  function buildStrengthExercises() {
    const result = {};
    strengthRows.forEach((row,index) => {
      const cleanedSets = row.sets
        .filter(set => set.reps || set.weight || set.rpe)
        .map(set => ({
          weight:Number(set.weight || 0),
          reps:Number(set.reps || 0),
          rpe:set.rpe === "" ? "" : Number(set.rpe)
        }));

      if (!cleanedSets.length) return;

      const key = row.plannedId + "_" + index;
      result[key] = {
        plannedId:row.plannedId,
        actualId:row.actualId,
        replacedFrom:row.replacedFrom,
        replaceReason:row.replaceReason,
        sets:cleanedSets,
        note:row.note || ""
      };
    });
    return result;
  }

  return (
    <div className="card">
      <div style={{ fontWeight:900, marginBottom:12 }}>
        {isCopyMode ? "Copy Last " : existing ? "Edit " : "Add "} {isCardio ? "Cardio" : "Strength"}
      </div>

      {isCardio ? (
        <>
          <input className="input" type="number" placeholder="Duration (min)" value={duration} onChange={e => setDuration(e.target.value)} />
          <input className="input" type="number" step="0.01" placeholder="Distance (km)" value={distance} onChange={e => setDistance(e.target.value)} />
          <input className="input" type="number" placeholder="Average HR" value={avgHR} onChange={e => setAvgHR(e.target.value)} />
          <input className="input" type="number" placeholder="Calories" value={calories} onChange={e => setCalories(e.target.value)} />
          <textarea className="input" placeholder="Notes" value={notes} onChange={e => setNotes(e.target.value)} />
        </>
      ) : (
        <>
          <RestTimer seconds={timer} setSeconds={setTimer} />

          <div className="grid3" style={{ marginBottom:10 }}>
            <button className="btn-small" onClick={() => setTimer(60)}>60s</button>
            <button className="btn-small" onClick={() => setTimer(90)}>90s</button>
            <button className="btn-small" onClick={() => setTimer(120)}>120s</button>
          </div>

          <input className="input" type="number" placeholder="Duration (min)" value={duration} onChange={e => setDuration(e.target.value)} />
          <input className="input" type="number" placeholder="Average HR" value={avgHR} onChange={e => setAvgHR(e.target.value)} />
          <input className="input" type="number" placeholder="Calories" value={calories} onChange={e => setCalories(e.target.value)} />
          <textarea className="input" placeholder="Notes" value={notes} onChange={e => setNotes(e.target.value)} />

          {strengthRows.map((row,rowIndex) => {
            const actualMeta = getExerciseMeta(row.actualId);
            const plannedMeta = getExerciseMeta(row.plannedId);
            const open = !!replaceOpen[rowIndex];

            return (
              <div key={row.uid} className="card2">
                <div className="row" style={{ marginBottom:10 }}>
                  <div>
                    <div style={{ fontWeight:900 }}>{actualMeta.icon} {actualMeta.name}</div>
                    <div className="muted">{actualMeta.muscle} • {actualMeta.equipment}</div>
                    {row.replacedFrom && <div className="muted" style={{ color:"var(--cyan)" }}>วันนี้เปลี่ยนจาก {plannedMeta.name}</div>}
                    <div className="muted green" style={{ marginTop:4 }}>{progressionText(logs, row.actualId)}</div>
                  </div>
                  <button className="btn-small" style={{ background:"#ff4757" }} onClick={() => removeExercise(rowIndex)}>ลบท่า</button>
                </div>

                <button className="btn-small" style={{ marginBottom:10 }} onClick={() => setReplaceOpen(o => ({ ...o, [rowIndex]:!open }))}>
                  {open ? "ซ่อน Replace" : "Replace"}
                </button>

                {open && (
                  <>
                    <div className="label">ท่าหลัก</div>
                    <select className="input" value={row.plannedId} onChange={e => changePlannedExercise(rowIndex, e.target.value)}>
                      {getVisibleExercises().map(ex => <option key={ex.id} value={ex.id}>{ex.name}</option>)}
                    </select>

                    <div className="label">วันนี้เล่นจริง</div>
                    <select className="input" value={row.actualId} onChange={e => replaceExercise(rowIndex, e.target.value)}>
                      {getVisibleExercises()
                        .filter(ex => ex.muscle === plannedMeta.muscle || ex.id === row.plannedId)
                        .map(ex => <option key={ex.id} value={ex.id}>{ex.name}</option>)}
                    </select>
                  </>
                )}

                {row.sets.map((set,setIndex) => (
                  <div key={setIndex} style={{ display:"grid", gridTemplateColumns:"54px 1fr 1fr 1fr 42px", gap:6, alignItems:"center", marginBottom:8 }}>
                    <div className="muted" style={{ fontWeight:900 }}>Set {setIndex + 1}</div>
                    <input className="input" style={{ marginBottom:0, textAlign:"center" }} type="number" step="0.5" placeholder="kg" value={set.weight} onChange={e => updateSet(rowIndex,setIndex,{ weight:e.target.value })} />
                    <input className="input" style={{ marginBottom:0, textAlign:"center" }} type="number" placeholder="reps" value={set.reps} onChange={e => updateSet(rowIndex,setIndex,{ reps:e.target.value })} />
                    <input className="input" style={{ marginBottom:0, textAlign:"center" }} type="number" step="0.5" placeholder="RPE" value={set.rpe} onChange={e => updateSet(rowIndex,setIndex,{ rpe:e.target.value })} />
                    <button className="btn-small" style={{ background:"#ff4757" }} onClick={() => removeSet(rowIndex,setIndex)}>×</button>
                  </div>
                ))}

                <button className="btn-small" onClick={() => addSet(rowIndex)}>+ Add Set</button>

                <input className="input" style={{ marginTop:10 }} placeholder="Note เช่น ฟอร์มดี / เจ็บไหล่ / ง่ายเกิน" value={row.note} onChange={e => updateRow(rowIndex,{ note:e.target.value })} />
              </div>
            );
          })}

          <button className="btn btn-dark" onClick={addExercise}>+ Add Exercise</button>
        </>
      )}

      <button className={"btn " + (isCardio ? "btn-blue" : "btn-orange")}
        onClick={() => onSave(isCardio ? {
          type:"cardio",
          duration:Number(duration || 0),
          distance:Number(distance || 0),
          avgHR:Number(avgHR || 0),
          calories:Number(calories || 0),
          notes,
        } : {
          type:"strength",
          duration:Number(duration || 0),
          avgHR:Number(avgHR || 0),
          calories:Number(calories || 0),
          exercises:buildStrengthExercises(),
          notes,
        })}>
        💾 Save
      </button>

      <button className="btn btn-dark" onClick={onCancel}>Cancel</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
