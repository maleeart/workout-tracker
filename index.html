<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Wracker — Workout Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root{--bg:#0b1120;--card:#111827;--card2:#162033;--muted:#94a3b8;--text:#e5e7eb;--line:#263143;--accent:#22c55e;--accent2:#38bdf8;--danger:#fb7185;--warn:#fbbf24;--r:20px}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#13233d,#0b1120 45%,#060914);color:var(--text);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    header{position:sticky;top:0;z-index:5;background:rgba(11,17,32,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
    h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted)}main{max-width:980px;margin:0 auto;padding:16px 14px 92px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(11,17,32,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.tab{border:0;background:transparent;color:var(--muted);font-size:12px;padding:8px 2px;border-radius:14px}.tab.active{background:#172554;color:#fff}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 12;background:linear-gradient(180deg,var(--card),#0f172a);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.18)}@media(min-width:760px){.half{grid-column:span 6}.third{grid-column:span 4}.two{grid-column:span 8}}
    h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:10px}.btn{border:1px solid var(--line);background:#1e293b;color:#fff;border-radius:14px;padding:10px 12px;font-weight:700}.btn.primary{background:linear-gradient(135deg,#16a34a,#22c55e);border-color:#22c55e;color:#03130a}.btn.blue{background:#0c4a6e;border-color:#0369a1}.btn.danger{background:#7f1d1d;border-color:#991b1b}.btn.ghost{background:transparent;color:var(--muted)}input,select,textarea{width:100%;background:#0b1220;border:1px solid var(--line);border-radius:14px;color:#fff;padding:11px;font-size:15px}label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:#cbd5e1;background:#0b1220;font-size:12px}.metric{font-size:28px;font-weight:900}.small{font-size:12px;color:var(--muted)}.item{border:1px solid var(--line);background:#0b1220;border-radius:16px;padding:12px}.exercise{border:1px solid var(--line);background:#101827;border-radius:18px;padding:12px}.sets{display:grid;gap:8px}.setrow{display:grid;grid-template-columns:42px 1fr 1fr 1fr 42px;gap:8px;align-items:end}.hidden{display:none!important}.progress{height:10px;background:#1e293b;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}.toast{position:fixed;left:16px;right:16px;bottom:86px;z-index:30;background:#052e16;border:1px solid #16a34a;border-radius:16px;padding:12px;display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:flex-end}.sheet{background:#0f172a;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px;width:100%;max-height:85vh;overflow:auto}.listbtn{width:100%;text-align:left;margin:6px 0}.warn{color:#fde68a}
  </style>
</head>
<body>
<header><div><h1>Wracker</h1><div class="sub">Calisthenics • Strength • Zone 2</div></div><button class="btn ghost" onclick="exportData()">Export</button></header>
<main>
  <section id="view-home" class="view grid"></section>
  <section id="view-workout" class="view grid hidden"></section>
  <section id="view-library" class="view grid hidden"></section>
  <section id="view-templates" class="view grid hidden"></section>
  <section id="view-settings" class="view grid hidden"></section>
</main>
<nav class="tabs">
  <button class="tab active" onclick="showView('home',this)">สรุป</button><button class="tab" onclick="showView('workout',this)">ซ้อม</button><button class="tab" onclick="showView('library',this)">ท่า</button><button class="tab" onclick="showView('templates',this)">แผน</button><button class="tab" onclick="showView('settings',this)">ตั้งค่า</button>
</nav>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="sheet"><div class="row"><h2 id="modalTitle">เลือก</h2><button class="btn ghost" onclick="closeModal()">ปิด</button></div><div id="modalBody"></div></div></div>
<script>
const LS='wracker_v2_db';
const today=()=>new Date().toISOString().slice(0,10);
const uid=p=>`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;

const DEFAULT_EXERCISES=[
{id:'pushup',name:'Push-up',type:'strength',muscle:'Chest',equipment:'Bodyweight'},
{id:'decline_pushup',name:'Decline Push-up',type:'strength',muscle:'Chest',equipment:'Bodyweight'},
{id:'pike_pushup',name:'Pike Push-up',type:'strength',muscle:'Shoulder',equipment:'Bodyweight'},
{id:'pullup',name:'Pull-up',type:'strength',muscle:'Back',equipment:'Bodyweight'},
{id:'negative_pullup',name:'Negative Pull-up',type:'strength',muscle:'Back',equipment:'Bodyweight'},
{id:'australian_pullup',name:'Australian Pull-up',type:'strength',muscle:'Back',equipment:'Bodyweight'},
{id:'db_shoulder_press',name:'DB Shoulder Press',type:'strength',muscle:'Shoulder',equipment:'Dumbbell'},
{id:'lateral_raise',name:'Lateral Raise',type:'strength',muscle:'Shoulder',equipment:'Dumbbell'},
{id:'reverse_fly',name:'Reverse Fly',type:'strength',muscle:'Shoulder',equipment:'Dumbbell'},
{id:'bodyweight_squat',name:'Bodyweight Squat',type:'strength',muscle:'Legs',equipment:'Bodyweight'},
{id:'goblet_squat',name:'Goblet Squat',type:'strength',muscle:'Legs',equipment:'Dumbbell'},
{id:'split_squat',name:'Split Squat',type:'strength',muscle:'Legs',equipment:'Bodyweight'},
{id:'hanging_knee_raise',name:'Hanging Knee Raise',type:'strength',muscle:'Core',equipment:'Bodyweight'},
{id:'plank',name:'Plank',type:'strength',muscle:'Core',equipment:'Bodyweight'},
{id:'zone2_run',name:'Zone 2 Run',type:'cardio',muscle:'Cardio',equipment:'Treadmill/Outdoor'}
];

const DEFAULT_TEMPLATES=[
{id:'push_day',name:'Push Day',exercises:['pushup','decline_pushup','pike_pushup','lateral_raise']},
{id:'pull_day',name:'Pull Day',exercises:['pullup','negative_pullup','australian_pullup','hanging_knee_raise']},
{id:'leg_core',name:'Leg + Core',exercises:['bodyweight_squat','goblet_squat','split_squat','plank']},
{id:'zone2',name:'Zone 2',exercises:['zone2_run']}
];

let db=load();
let current=null;

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(LS));
    if(x&&x.version)return x;
  }catch(e){}
  return {
    version:2,
    exercises:DEFAULT_EXERCISES,
    templates:DEFAULT_TEMPLATES,
    sessions:[],
    goals:{pullup:5,pace:'8:00/km',zone2Min:120}
  };
}

function save(){localStorage.setItem(LS,JSON.stringify(db));renderAll();}
function ex(id){return db.exercises.find(e=>e.id===id)||{id,name:id,muscle:'Other',equipment:'-'};}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200);}
function showView(v,el){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));document.getElementById('view-'+v).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el?.classList.add('active');renderAll();}
function renderAll(){renderHome();renderWorkout();renderLibrary();renderTemplates();renderSettings();}

function weekStart(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function isThisWeek(date){return new Date(date)>=weekStart();}
function strengthSets(s){return (s.exercises||[]).flatMap(e=>(e.sets||[]).map(set=>({...set,exerciseId:e.actualExerciseId||e.exerciseId}))).filter(x=>x.reps);}
function volumeOf(set){return (+set.weight||0)*(+set.reps||0);}

function renderHome(){
  const root=document.getElementById('view-home');
  const week=db.sessions.filter(s=>isThisWeek(s.date));
  const sets=week.flatMap(strengthSets);
  const vol=sets.reduce((a,b)=>a+volumeOf(b),0);
  const z2=week.flatMap(s=>s.exercises||[]).filter(e=>ex(e.actualExerciseId||e.exerciseId).type==='cardio').reduce((a,e)=>a+(+e.duration||0),0);
  const last=db.sessions[0];
  const streak=calcStreak();

  root.innerHTML=`
  <div class="card two">
    <h2>สรุปสัปดาห์นี้</h2>
    <div class="grid">
      <div class="card third"><div class="small">Workout</div><div class="metric">${week.length}</div><div class="small">ครั้ง</div></div>
      <div class="card third"><div class="small">Volume</div><div class="metric">${Math.round(vol)}</div><div class="small">kg-reps</div></div>
      <div class="card third"><div class="small">Zone 2</div><div class="metric">${z2}</div><div class="small">นาที</div></div>
    </div>
  </div>
  <div class="card third">
    <h2>Streak</h2><div class="metric">🔥 ${streak}</div><div class="small">วันต่อเนื่อง</div>
    <div class="progress"><div class="bar" style="width:${Math.min(100,streak*10)}%"></div></div>
  </div>
  <div class="card half"><h2>Personal Records</h2>${renderPR()}</div>
  <div class="card half"><h2>ล่าสุด</h2>${last?renderSessionSummary(last):'<div class="small">ยังไม่มีบันทึก เริ่มจากแท็บ “ซ้อม”</div>'}</div>`;
}

function calcStreak(){
  const days=[...new Set(db.sessions.map(s=>s.date))].sort().reverse();
  let n=0,d=new Date(today());
  for(;;){
    const key=d.toISOString().slice(0,10);
    if(days.includes(key)){n++;d.setDate(d.getDate()-1);}
    else if(n===0&&key===today()){d.setDate(d.getDate()-1);}
    else break;
  }
  return n;
}

function renderPR(){
  const best={};
  db.sessions.forEach(s=>strengthSets(s).forEach(set=>{
    const id=set.exerciseId;
    const reps=+set.reps||0,w=+set.weight||0,score=w?volumeOf(set):reps;
    if(!best[id]||score>best[id].score)best[id]={score,reps,w};
  }));
  const rows=Object.entries(best).sort((a,b)=>b[1].score-a[1].score).slice(0,6);
  return rows.length?rows.map(([id,b])=>`
    <div class="item row">
      <div><b>${ex(id).name}</b><div class="small">${ex(id).muscle}</div></div>
      <span class="pill">${b.w?b.w+' kg × ':''}${b.reps} reps</span>
    </div>`).join(''):'<div class="small">ยังไม่มี PR</div>';
}

function renderSessionSummary(s){
  return `<div class="item">
    <b>${s.name}</b><div class="small">${s.date}</div>
    ${(s.exercises||[]).map(e=>`
      <div class="row">
        <span>${ex(e.actualExerciseId||e.exerciseId).name}${e.replacedFrom?' <span class="warn">(แทน '+ex(e.replacedFrom).name+')</span>':''}</span>
        <span class="pill">${ex(e.actualExerciseId||e.exerciseId).type==='cardio'?(e.duration||0)+' นาที':(e.sets||[]).length+' sets'}</span>
      </div>`).join('')}
  </div>`;
}

function renderWorkout(){
  const root=document.getElementById('view-workout');
  if(!current){
    root.innerHTML=`
    <div class="card">
      <h2>เริ่มซ้อม</h2>
      <div class="stack">
        ${db.templates.map(t=>`<button class="btn primary" onclick="startTemplate('${t.id}')">เริ่ม ${t.name}</button>`).join('')}
        <button class="btn blue" onclick="copyLastWorkout()">Copy Last Workout</button>
        <button class="btn" onclick="startBlank()">เริ่มแบบว่าง</button>
      </div>
    </div>
    <div class="card"><h2>ประวัติล่าสุด</h2>${db.sessions.slice(0,8).map(renderSessionSummary).join('')||'<div class="small">ยังไม่มีประวัติ</div>'}</div>`;
    return;
  }

  root.innerHTML=`
  <div class="card">
    <div class="row">
      <div><h2>${current.name}</h2><div class="small">${current.date}</div></div>
      <button class="btn primary" onclick="finishSession()">บันทึกจบ</button>
    </div>
  </div>
  <div class="card">
    <div class="stack">
      ${current.exercises.map((e,i)=>renderWorkoutExercise(e,i)).join('')}
      <button class="btn blue" onclick="openAddExercise()">+ Add Exercise</button>
    </div>
  </div>`;
}

function renderWorkoutExercise(e,i){
  const meta=ex(e.actualExerciseId||e.exerciseId);
  if(meta.type==='cardio')return `
  <div class="exercise">
    <div class="row">
      <div><b>${meta.name}</b>${e.replacedFrom?`<div class="small warn">แทน ${ex(e.replacedFrom).name}</div>`:''}</div>
      <button class="btn ghost" onclick="openReplace(${i})">Replace</button>
    </div>
    <label>Duration (min)</label><input type="number" value="${e.duration||''}" onchange="current.exercises[${i}].duration=this.value">
    <label>Distance (km)</label><input type="number" step="0.01" value="${e.distance||''}" onchange="current.exercises[${i}].distance=this.value">
    <label>Avg HR</label><input type="number" value="${e.avgHr||''}" onchange="current.exercises[${i}].avgHr=this.value">
  </div>`;

  return `
  <div class="exercise">
    <div class="row">
      <div><b>${meta.name}</b><div class="small">${meta.muscle} • ${meta.equipment}${e.replacedFrom?` • <span class="warn">แทน ${ex(e.replacedFrom).name}</span>`:''}</div></div>
      <button class="btn ghost" onclick="openReplace(${i})">Replace</button>
    </div>
    <div class="sets">
      ${(e.sets||[]).map((s,si)=>`
      <div class="setrow">
        <span class="pill">#${si+1}</span>
        <div><label>kg</label><input type="number" step="0.5" value="${s.weight||''}" onchange="current.exercises[${i}].sets[${si}].weight=this.value"></div>
        <div><label>reps</label><input type="number" value="${s.reps||''}" onchange="current.exercises[${i}].sets[${si}].reps=this.value"></div>
        <div><label>RPE</label><input type="number" step="0.5" value="${s.rpe||''}" onchange="current.exercises[${i}].sets[${si}].rpe=this.value"></div>
        <button class="btn danger" onclick="current.exercises[${i}].sets.splice(${si},1);renderWorkout()">×</button>
      </div>`).join('')}
    </div>
    <button class="btn" onclick="addSet(${i})">+ Add Set</button>
    <label>Note</label><input value="${e.note||''}" onchange="current.exercises[${i}].note=this.value" placeholder="ฟอร์ม / เจ็บ / ง่าย-ยาก">
  </div>`;
}

function startTemplate(id){
  const t=db.templates.find(x=>x.id===id);
  current={id:uid('sess'),date:today(),name:t.name,sourceTemplateId:id,exercises:t.exercises.map(id=>seedExercise(id))};
  renderWorkout();
}

function startBlank(){current={id:uid('sess'),date:today(),name:'Custom Workout',exercises:[]};renderWorkout();}

function seedExercise(id){
  const last=findLastExercise(id);
  const m=ex(id);
  return m.type==='cardio'
    ? {exerciseId:id,duration:last?.duration||'',distance:last?.distance||'',avgHr:last?.avgHr||''}
    : {exerciseId:id,sets:last?.sets?.length?last.sets.map(s=>({weight:s.weight||'',reps:s.reps||'',rpe:s.rpe||''})):[{weight:'',reps:'',rpe:''},{weight:'',reps:'',rpe:''},{weight:'',reps:'',rpe:''}]};
}

function findLastExercise(id){
  for(const s of db.sessions){
    const found=(s.exercises||[]).find(e=>(e.actualExerciseId||e.exerciseId)===id);
    if(found)return found;
  }
  return null;
}

function copyLastWorkout(){
  const s=db.sessions[0];
  if(!s){toast('ยังไม่มี workout ก่อนหน้า');return;}
  current={...JSON.parse(JSON.stringify(s)),id:uid('sess'),date:today(),name:s.name+' (copy)'};
  renderWorkout();
}

function addSet(i){
  current.exercises[i].sets=current.exercises[i].sets||[];
  const prev=current.exercises[i].sets.at(-1)||{};
  current.exercises[i].sets.push({weight:prev.weight||'',reps:prev.reps||'',rpe:''});
  renderWorkout();
}

function finishSession(){
  if(!current.exercises.length){toast('เพิ่มท่าก่อนบันทึก');return;}
  db.sessions.unshift(JSON.parse(JSON.stringify(current)));
  current=null;
  save();
  toast('บันทึก session แล้ว');
}

function openAddExercise(){
  openPicker('เพิ่มท่า',id=>{
    current.exercises.push(seedExercise(id));
    closeModal();
    renderWorkout();
  });
}

function openReplace(i){
  const old=current.exercises[i].actualExerciseId||current.exercises[i].exerciseId;
  openPicker('เลือกท่าแทน '+ex(old).name,id=>{
    current.exercises[i]={...seedExercise(id),exerciseId:current.exercises[i].exerciseId,replacedFrom:old,actualExerciseId:id,replaceReason:'changed_in_session'};
    closeModal();
    renderWorkout();
  },ex(old).muscle);
}

function openPicker(title,cb,muscle){
  window.__pickerCallback=cb;
  document.getElementById('modalTitle').textContent=title;
  const list=db.exercises.filter(e=>!muscle||e.muscle===muscle);
  document.getElementById('modalBody').innerHTML=list.map(e=>`
    <button class="btn listbtn" onclick="window.__pickerCallback('${e.id}')">
      <b>${e.name}</b><div class="small">${e.muscle} • ${e.equipment}</div>
    </button>`).join('')+
    `<button class="btn blue listbtn" onclick="closeModal();showView('library')">+ สร้างท่าใหม่</button>`;
  document.getElementById('modal').style.display='flex';
}

function closeModal(){document.getElementById('modal').style.display='none';}

function renderLibrary(){
  const root=document.getElementById('view-library');
  const muscles=[...new Set(db.exercises.map(e=>e.muscle))];
  root.innerHTML=`
  <div class="card">
    <h2>Exercise Library</h2>
    <div class="grid">
      <div class="card half">
        <label>ชื่อท่า</label><input id="newExName" placeholder="เช่น DB Row">
        <label>Muscle</label><select id="newExMuscle">${['Chest','Back','Shoulder','Legs','Core','Cardio','Arms','Other'].map(m=>`<option>${m}</option>`).join('')}</select>
        <label>Equipment</label><input id="newExEquip" placeholder="Dumbbell / Bodyweight">
        <button class="btn primary" onclick="addExercise()">+ Add Exercise</button>
      </div>
      <div class="card half"><h3>กลุ่มท่า</h3>${muscles.map(m=>`<span class="pill">${m}</span>`).join(' ')}</div>
    </div>
  </div>
  <div class="card"><div class="stack">
    ${db.exercises.map(e=>`
      <div class="item row">
        <div><b>${e.name}</b><div class="small">${e.muscle} • ${e.equipment}</div></div>
        <button class="btn ghost" onclick="deleteExercise('${e.id}')">ลบ</button>
      </div>`).join('')}
  </div></div>`;
}

function addExercise(){
  const name=document.getElementById('newExName').value.trim();
  if(!name)return;
  const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||uid('ex');
  db.exercises.push({
    id,
    name,
    type:document.getElementById('newExMuscle').value==='Cardio'?'cardio':'strength',
    muscle:document.getElementById('newExMuscle').value,
    equipment:document.getElementById('newExEquip').value||'Other'
  });
  save();
  toast('เพิ่มท่าแล้ว');
}

function deleteExercise(id){
  if(DEFAULT_EXERCISES.some(e=>e.id===id)){toast('ท่าหลักไม่แนะนำให้ลบ');return;}
  db.exercises=db.exercises.filter(e=>e.id!==id);
  save();
}

function renderTemplates(){
  const root=document.getElementById('view-templates');
  root.innerHTML=`
  <div class="card">
    <h2>Workout Templates</h2>
    ${db.templates.map(t=>`
      <div class="item">
        <div class="row">
          <div><b>${t.name}</b><div class="small">${t.exercises.map(id=>ex(id).name).join(' • ')}</div></div>
          <button class="btn ghost" onclick="editTemplate('${t.id}')">แก้</button>
        </div>
      </div>`).join('')}
    <button class="btn primary" onclick="newTemplate()">+ New Template</button>
  </div>`;
}

function newTemplate(){
  const name=prompt('ชื่อแผนใหม่');
  if(!name)return;
  db.templates.push({id:uid('tpl'),name,exercises:[]});
  save();
}

function editTemplate(id){
  const t=db.templates.find(x=>x.id===id);
  document.getElementById('modalTitle').textContent='แก้แผน '+t.name;
  document.getElementById('modalBody').innerHTML=`
  <div class="stack">
    <label>ชื่อแผน</label><input id="tplName" value="${t.name}">
    <h3>ท่าในแผน</h3>
    ${t.exercises.map((eid,i)=>`
      <div class="item row">
        <span>${ex(eid).name}</span>
        <button class="btn danger" onclick="db.templates.find(x=>x.id==='${id}').exercises.splice(${i},1);save();editTemplate('${id}')">ลบ</button>
      </div>`).join('')}
    <select id="tplAdd">${db.exercises.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select>
    <button class="btn" onclick="db.templates.find(x=>x.id==='${id}').exercises.push(document.getElementById('tplAdd').value);save();editTemplate('${id}')">+ เพิ่มท่า</button>
    <button class="btn primary" onclick="db.templates.find(x=>x.id==='${id}').name=document.getElementById('tplName').value;save();closeModal()">บันทึก</button>
  </div>`;
  document.getElementById('modal').style.display='flex';
}

function renderSettings(){
  document.getElementById('view-settings').innerHTML=`
  <div class="card">
    <h2>Backup / Restore</h2>
    <div class="stack">
      <button class="btn primary" onclick="exportData()">Export JSON</button>
      <input type="file" accept="application/json" onchange="importData(this.files[0])">
      <button class="btn danger" onclick="if(confirm('ล้างข้อมูลทั้งหมด?')){localStorage.removeItem(LS);location.reload()}">Reset Local Data</button>
    </div>
  </div>
  <div class="card">
    <h2>Data Model</h2>
    <div class="small">
      Program Template = แผนตั้งต้น<br>
      Session Log = สิ่งที่ซ้อมจริง<br>
      Exercise Library = คลังท่าทั้งหมด<br>
      Replace Exercise จะบันทึก planned/actual แยกกัน ไม่ทำให้แผนหลักพัง
    </div>
  </div>`;
}

function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='wracker-backup-'+today()+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.exercises||!data.sessions)throw Error();
      db=data;
      save();
      toast('Import สำเร็จ');
    }catch(e){
      toast('ไฟล์ไม่ถูกต้อง');
    }
  };
  r.readAsText(file);
}

renderAll();
</script>
</body>
</html>
