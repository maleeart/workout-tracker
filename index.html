<!DOCTYPE html>
<html lang="th">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="Wracker.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Calisthenics & Zone 2</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;900&family=Barlow+Condensed:wght@600;700;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:#080c14;color:#e8edf5;font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
    :root{--cyan:#00d4ff;--cyan2:#008cb3;--orange:#ff6b2b;--orange2:#cc3f00;--green:#00e676;--purple:#a855f7;--danger:#ff4757;--card:#101824;--card2:#141e2c;--card3:#0b111c;--border:rgba(255,255,255,.08);--text2:#7a8fa8;--text3:#9eb1c7}
    button,input,textarea,select{font-family:inherit} input:focus,textarea:focus,select:focus{outline:2px solid var(--cyan)}
    .app{width:100%;max-width:430px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top,18px) 0 calc(env(safe-area-inset-bottom,16px) + 88px)}
    .header{padding:16px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;letter-spacing:.3px;line-height:1}
    .badge{white-space:nowrap;font-size:11px;color:var(--green);background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.35);border-radius:999px;padding:5px 10px;font-weight:800}
    .section{padding:0 12px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01)),var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
    .card2{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01)),var(--card2);border:1px solid var(--border);border-radius:17px;padding:14px;margin-bottom:10px}
    .ai-card{background:radial-gradient(circle at top right,rgba(168,85,247,.22),transparent 42%),linear-gradient(135deg,#1a0d2e,#0d1a2e);border-color:rgba(168,85,247,.35)}
    .muted{color:var(--text2);font-size:12px}.label{color:var(--text2);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .btn{width:100%;border:0;border-radius:999px;padding:14px 16px;color:#fff;font-weight:900;font-size:15px;letter-spacing:.5px;margin-bottom:10px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
    .btn:active,.btn-small:active{transform:scale(.98)}.btn-blue{background:linear-gradient(135deg,var(--cyan),var(--cyan2));box-shadow:0 8px 24px rgba(0,212,255,.22)}
    .btn-orange{background:linear-gradient(135deg,var(--orange),var(--orange2));box-shadow:0 8px 24px rgba(255,107,43,.22)}.btn-dark{background:#253044}.btn-red{background:var(--danger)}
    .btn-small{border:0;border-radius:12px;padding:8px 10px;color:#fff;background:#253044;font-size:12px;font-weight:900}
    .segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:16px;padding:5px;margin-bottom:12px}
    .seg-btn{border:0;border-radius:12px;padding:10px 8px;background:transparent;color:var(--text2);font-weight:900;font-size:12px}
    .seg-btn.active{background:rgba(0,212,255,.15);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(0,212,255,.28)}
    .input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:#fff;margin-bottom:10px;font-size:15px}
    select.input{appearance:none;-webkit-appearance:none;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01)),var(--card2)}
    .tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:900;margin-bottom:8px}
    .tag-cardio{color:var(--cyan);background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.35)}.tag-strength{color:var(--orange);background:rgba(255,107,43,.1);border:1px solid rgba(255,107,43,.35)}.tag-strava{color:var(--purple);background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.35)}
    .recovery-circle{width:96px;height:96px;margin:12px auto;border-radius:50%;border:3px solid var(--green);background:rgba(0,230,118,.1);display:flex;align-items:center;justify-content:center;color:var(--green);font-family:'Barlow Condensed';font-size:32px;font-weight:900;box-shadow:0 0 28px rgba(0,230,118,.12)}
